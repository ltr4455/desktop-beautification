<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: file:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>灵动桌面 FlowDesk</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="layer">

    <div id="containers"></div>

    <!-- 应用停靠栏（屏幕中下部，靠近任务栏） -->
    <div id="dock-wrap" class="hidden">
      <div id="dock"><div id="dock-track"></div></div>
      <div class="dock-sep"></div>
      <button id="dock-warehouse" title="仓库（全部应用）">▦</button>
    </div>

    <!-- 应用仓库弹层 -->
    <div id="warehouse" class="hidden">
      <div class="wh-head">
        <span id="wh-title">应用仓库</span>
        <button class="wh-close" title="关闭">✕</button>
      </div>
      <input id="wh-search" type="search" placeholder="🔍 搜索应用…" autocomplete="off" spellcheck="false">
      <div id="wh-scroll">
        <div id="wh-grid" class="wh-grid"></div>
      </div>
    </div>

    <!-- 右键菜单 -->
    <div id="context-menu" class="menu hidden"></div>

    <!-- 独立设置中心 -->
    <div id="settings-panel" class="settings-overlay hidden">
      <div class="settings-window">
        <header class="settings-topbar">
          <div class="settings-brand">
            <span class="settings-brand-mark">F</span>
            <div><strong>灵动桌面设置</strong><span>FlowDesk Control Center</span></div>
          </div>
          <div class="settings-top-actions">
            <span id="settings-save-state" class="settings-save-state">设置自动保存</span>
            <button class="panel-close" data-close="settings-panel" title="关闭设置">✕</button>
          </div>
        </header>

        <div class="settings-layout">
          <aside class="settings-sidebar">
            <button class="stab active" data-tab="general"><span>⌂</span><b>基础设置</b></button>
            <button class="stab" data-tab="appearance"><span>◈</span><b>外观材质</b></button>
            <button class="stab" data-tab="motion"><span>✦</span><b>交互动效</b></button>
            <button class="stab" data-tab="dock"><span>▱</span><b>应用栏</b></button>
            <button class="stab" data-tab="layout"><span>⌗</span><b>桌面布局</b></button>
            <button class="stab" data-tab="data"><span>☷</span><b>数据管理</b></button>
            <button class="stab" data-tab="about"><span>ⓘ</span><b>关于</b></button>
          </aside>

          <main class="panel-body settings-content">
            <div class="settings-page-head">
              <div><h2 id="settings-page-title">基础设置</h2><p id="settings-page-desc">管理启动、推荐与桌面系统行为</p></div>
            </div>

            <section class="stab-page" data-page="general" data-title="基础设置" data-desc="管理启动、推荐与桌面系统行为">
              <div class="settings-card">
                <div class="settings-card-title"><div><b>智能推荐</b><span>控制应用栏中自动推荐的项目数量</span></div></div>
                <div class="setting-range"><span>推荐数量</span><input type="range" id="set-recommend" min="3" max="20" step="1" value="8"><output id="set-recommend-val">8</output></div>
              </div>
              <div class="settings-card settings-list">
                <label class="setting-item"><div><b>开机自启动</b><span>登录 Windows 后自动运行灵动桌面</span></div><input type="checkbox" id="set-autostart" class="switch"></label>
                <label class="setting-item"><div><b>硬件加速</b><span>使用 GPU 提升动画流畅度，修改后需重启</span></div><input type="checkbox" id="set-hwaccel" class="switch"></label>
                <label class="setting-item"><div><b>隐藏系统桌面图标</b><span id="icons-hint">控制 Windows 原生桌面图标的显示状态</span></div><input type="checkbox" id="set-hideicons" class="switch"></label>
              </div>
            </section>

            <section class="stab-page hidden" data-page="appearance" data-title="外观材质" data-desc="统一调整应用栏和分类条的视觉风格">
              <div class="settings-card">
                <div class="settings-card-title"><div><b>编辑对象</b><span id="style-target">应用栏（独立设置）</span></div></div>
                <div id="appearance-targets" class="seg large-seg"><button class="seg-btn" data-target="app">应用栏</button><button class="seg-btn" data-target="categories">全部分类条</button></div>
              </div>
              <div class="settings-card">
                <div class="settings-card-title"><div><b>材质与主色</b><span>选择玻璃表面的质感与强调色</span></div><input type="color" id="st-color" value="#7aa2ff" title="主色"></div>
                <div id="st-textures" class="texture-grid"></div>
              </div>
              <div class="settings-card settings-list">
                <label id="st-opacity-field" class="setting-range"><span>背景透明度</span><input type="range" id="st-opacity" min="10" max="100" value="90"><output id="st-opacity-val">0.90</output></label>
                <label id="st-content-opacity-field" class="setting-range"><span>内容透明度</span><input type="range" id="st-content-opacity" min="10" max="100" value="100"><output id="st-content-opacity-val">1.00</output></label>
                <div id="dock-opacity-fields" class="hidden range-stack"><label class="setting-range"><span>背景透明度</span><input type="range" id="st-bg-opacity" min="10" max="100" value="90"><output id="st-bg-opacity-val">0.90</output></label><label class="setting-range"><span>图标透明度</span><input type="range" id="st-icon-opacity" min="10" max="100" value="100"><output id="st-icon-opacity-val">1.00</output></label></div>
                <label class="setting-range"><span>圆角大小</span><input type="range" id="st-radius" min="0" max="32" value="16"><output id="st-radius-val">16px</output></label>
                <label class="setting-item compact"><div><b>显示边框</b><span>为当前对象保留玻璃高光描边</span></div><input type="checkbox" id="st-border" class="switch" checked></label>
              </div>
              <button id="st-reset" class="btn ghost danger-soft">恢复当前对象默认外观</button>
            </section>

            <section class="stab-page hidden" data-page="motion" data-title="交互动效" data-desc="分别控制全局动画和当前对象的交互反馈">
              <div class="settings-card">
                <div class="settings-card-title"><div><b>当前对象覆盖</b><span>只影响“外观材质”页面中选中的对象</span></div></div>
                <div id="an-type-row" class="choice-grid"><button class="mini-btn" data-type="">跟随全局</button><button class="mini-btn" data-type="none">无动效</button><button class="mini-btn" data-type="fade">淡入</button><button class="mini-btn" data-type="rise">上浮</button><button class="mini-btn" data-type="zoom">缩放</button><button class="mini-btn" data-type="spring">弹性</button></div>
                <label class="setting-item compact"><div><b>当前对象悬停反馈</b><span>启用上浮和光感变化</span></div><input type="checkbox" id="an-hover" class="switch" checked></label>
              </div>
              <div class="settings-card settings-list">
                <label class="setting-item"><div><b>全局窗口动效</b><span>控制分类条和窗口出现时的动画</span></div><input type="checkbox" id="set-anim" class="switch"></label>
                <div class="setting-block"><b>全局动效类型</b><div id="set-anim-type-row" class="choice-grid"><button class="mini-btn" data-type="none">无动效</button><button class="mini-btn" data-type="fade">淡入</button><button class="mini-btn" data-type="rise">上浮</button><button class="mini-btn" data-type="zoom">缩放</button><button class="mini-btn" data-type="spring">弹性</button></div></div>
                <label class="setting-range"><span>窗口动效时长</span><input type="range" id="set-anim-dur" min="100" max="800" step="50" value="300"><output id="set-anim-dur-val">300ms</output></label>
                <label class="setting-range"><span>展开与收起速度</span><input type="range" id="set-panel-transition-dur" min="250" max="1200" step="50" value="620"><output id="set-panel-transition-dur-val">620ms</output></label>
                <label class="setting-item"><div><b>全局悬停反馈</b><span>为分类条启用上浮和光晕反馈</span></div><input type="checkbox" id="set-hover" class="switch"></label>
              </div>
            </section>

            <section class="stab-page hidden" data-page="dock" data-title="应用栏" data-desc="调整 Dock 的尺寸、位置和鼠标操作方式">
              <div class="settings-card settings-list">
                <label class="setting-item"><div><b>悬浮放大</b><span>指针经过图标时放大并推开相邻图标</span></div><input type="checkbox" id="set-dock-magnify" class="switch"></label>
                <label class="setting-item"><div><b>反转滚轮方向</b><span>切换滚轮浏览应用的前后方向</span></div><input type="checkbox" id="set-dock-wheel-invert" class="switch"></label>
                <label class="setting-range"><span>图标大小</span><input type="range" id="set-dock-size" min="28" max="56" step="1" value="38"><output id="set-dock-size-val">38px</output></label>
              </div>
              <div class="settings-card">
                <div class="settings-card-title"><div><b>屏幕位置</b><span>选择预设位置后可继续进行像素微调</span></div></div>
                <div id="dock-pos-grid" class="dock-pos-grid"><button class="dock-pos-btn" data-pos="top-left">↖ 左上</button><button class="dock-pos-btn" data-pos="top-center">↑ 顶部</button><button class="dock-pos-btn" data-pos="top-right">↗ 右上</button><button class="dock-pos-btn" data-pos="bottom-left">↙ 左下</button><button class="dock-pos-btn" data-pos="bottom-center">↓ 底部</button><button class="dock-pos-btn" data-pos="bottom-right">↘ 右下</button></div>
                <label class="setting-range"><span>水平偏移</span><input type="range" id="set-dock-offset-x" min="-300" max="300" step="1" value="0"><output id="set-dock-offset-x-val">0px</output></label>
                <label class="setting-range"><span>垂直偏移</span><input type="range" id="set-dock-offset-y" min="-120" max="120" step="1" value="0"><output id="set-dock-offset-y-val">0px</output></label>
              </div>
            </section>

            <section class="stab-page hidden" data-page="layout" data-title="桌面布局" data-desc="管理分类条方向、扫描与布局恢复">
              <div class="settings-card">
                <div class="settings-card-title"><div><b>分类条停靠方向</b><span>选择分类条默认排列在屏幕哪一侧</span></div></div>
                <div class="seg large-seg"><button class="seg-btn" id="set-side-left">靠左显示</button><button class="seg-btn active" id="set-side-right">靠右显示</button></div>
              </div>
              <div class="settings-card action-list"><button id="btn-refresh" class="action-row"><span>↻</span><div><b>重新扫描桌面</b><small>立即同步桌面文件和快捷方式</small></div></button><button id="btn-show-all" class="action-row"><span>◉</span><div><b>显示全部内容</b><small>恢复所有隐藏的容器与条目</small></div></button><button id="btn-reset-layout" class="action-row danger"><span>↺</span><div><b>重置桌面布局</b><small>清除位置调整并恢复默认排列</small></div></button></div>
            </section>

            <section class="stab-page hidden" data-page="data" data-title="数据管理" data-desc="管理使用记录以及被隐藏的桌面项目">
              <div class="settings-card action-list"><button id="btn-clear-usage" class="action-row danger"><span>⌫</span><div><b>清空使用记录</b><small>删除智能推荐使用的历史统计</small></div></button></div>
              <div class="settings-card"><div class="settings-card-title"><div><b>已隐藏条目</b><span>可以单独恢复误隐藏的文件或快捷方式</span></div></div><div id="hidden-list" class="hidden-list"></div><button id="btn-restore-all" class="btn ghost">恢复全部已隐藏条目</button></div>
            </section>

            <section class="stab-page hidden" data-page="about" data-title="关于灵动桌面" data-desc="查看版本、数据目录和运行状态">
              <div class="about-hero"><span class="about-logo">F</span><div><h3>灵动桌面 FlowDesk</h3><p id="about-version"></p></div></div>
              <div class="settings-card about-info"><div><b>用户数据目录</b><span id="about-datadir"></span></div><div id="gpu-note" class="notice warning hidden"></div></div>
              <button id="btn-quit" class="btn ghost danger-soft">退出灵动桌面</button>
            </section>
          </main>
        </div>
      </div>
    </div>

    <div id="toast" class="hidden"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
